# IHSA CI: backend lint + full test suite against a throwaway PostgreSQL, frontend lint/types/tests/build,
# dependency audits and a secret scan. No external AI services are called: tests use deterministic
# doubles (hash embeddings, extractive answers, fake OCR). Live-model evaluation is not part of CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ihsa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ihsa_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ihsa_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff pytest pip-audit
      - run: ruff check app tests scripts
      # -ra lists every skipped test in the log; with the postgres service up, none should be skipped.
      - run: python -m pytest -ra
      - run: pip-audit -r requirements.txt
      - name: Secret scan
        working-directory: .
        run: python backend/scripts/secret_scan.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npm audit --audit-level=high
